name: hookrelay

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    working_dir: /workspace
    command: sh -c "npm run build --workspace=@hookrelay/shared && npm run dev --workspace=@hookrelay/api"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: mongodb://mongo:27017/hookrelay
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
    ports:
      - '3001:3001'
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/dashboard/node_modules
      - /workspace/packages/shared/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    working_dir: /workspace
    command: npm run dev --workspace=@hookrelay/dashboard -- --host 0.0.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - '5173:5173'
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/dashboard/node_modules
      - /workspace/packages/shared/node_modules
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
