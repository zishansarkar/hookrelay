app = "hookrelay-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 3
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# Configure REDIS_URL, DATABASE_URL, JWT_SECRET, HMAC_DEFAULT_SECRET, FRONTEND_URL,
# and Stripe secrets with `fly secrets set`. Scale with:
#   fly scale count 1 --max-per-region 3
